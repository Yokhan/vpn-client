name: Release
on:
  push:
    tags:
      - "v*"
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag"
        required: true
      publish:
        description: "Publish GitHub Release"
        required: false
        default: true
        type: boolean
      play:
        description: "Build Play bundle"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create draft release"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
      play: ${{ steps.meta.outputs.play }}
      draft: ${{ steps.meta.outputs.draft }}
    steps:
      - id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "play=false" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
            echo "play=${{ inputs.play }}" >> "$GITHUB_OUTPUT"
            echo "draft=${{ inputs.draft }}" >> "$GITHUB_OUTPUT"
          fi
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - prepare
    env:
      BUILD_PLUGIN: none
      YOKHAN_COMPOSE_DASHBOARD: "1"
      CORE_SING_BOX_REPO: ${{ vars.CORE_SING_BOX_REPO }}
      CORE_SING_BOX_GIT_URL: ${{ vars.CORE_SING_BOX_GIT_URL }}
      CORE_LIBNEKO_REPO: ${{ vars.CORE_LIBNEKO_REPO }}
      CORE_LIBNEKO_GIT_URL: ${{ vars.CORE_LIBNEKO_GIT_URL }}
      CORE_GOMOBILE_REPO: ${{ vars.CORE_GOMOBILE_REPO }}
      CORE_GOMOBILE_REF: ${{ vars.CORE_GOMOBILE_REF }}
      CORE_GOMOBILE_GIT_URL: ${{ vars.CORE_GOMOBILE_GIT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: libcore-cache
        uses: actions/cache@v5
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.libcore-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ^1.25
          cache-dependency-path: libcore/go.sum
      - name: Native Build
        if: steps.libcore-cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Verify LibCore artifact
        shell: bash
        run: test -s app/libs/libcore.aar
      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Restore release keystore
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          fi
      - name: Gradle Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew :shared-domain:check app:assembleOssRelease
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist/apk
          find app/build/outputs/apk/oss/release -type f \( -name "*.apk" -o -name "*.dm" -o -name "output-metadata.json" \) -exec cp --parents {} dist/apk \;
      - name: Upload Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: gates-android-release
          path: dist/apk/**/*.apk
          if-no-files-found: error
  windows:
    name: Build Windows installers
    runs-on: windows-latest
    needs:
      - prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore pinned Windows runtime
        shell: pwsh
        run: |
          $singBoxUrl = "https://github.com/SagerNet/sing-box/releases/download/v1.13.12/sing-box-1.13.12-windows-amd64.zip"
          Invoke-WebRequest -Uri $singBoxUrl -OutFile sing-box.zip
          Expand-Archive -LiteralPath sing-box.zip -DestinationPath runtime
          $runtime = (Resolve-Path "runtime\sing-box-1.13.12-windows-amd64").Path

          $xrayArchiveUrl = "https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-windows-64.zip"
          $expectedXrayArchiveSha = "2e04a9995a6f2ad1b28c0bb25c708ecb2695e43a1c9c7889c4b6ac2b48cf7a6a"
          $expectedXrayExeSha = "d5b558191cccb1e92a5772b68b8cab67717b26f634b0f15153215f65ae982a7e"
          Invoke-WebRequest -Uri $xrayArchiveUrl -OutFile xray.zip
          $actualArchiveSha = (Get-FileHash -LiteralPath xray.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualArchiveSha -ne $expectedXrayArchiveSha) {
            throw "Xray-windows-64.zip SHA-256 mismatch: expected $expectedXrayArchiveSha, got $actualArchiveSha"
          }
          Expand-Archive -LiteralPath xray.zip -DestinationPath xray-runtime
          $xrayExe = Join-Path "xray-runtime" "xray.exe"
          $xrayLicense = Join-Path "xray-runtime" "LICENSE"
          if (-not (Test-Path -LiteralPath $xrayExe)) { throw "xray.exe missing in Xray-windows-64.zip" }
          if (-not (Test-Path -LiteralPath $xrayLicense)) { throw "LICENSE missing in Xray-windows-64.zip" }
          $actualExeSha = (Get-FileHash -LiteralPath $xrayExe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualExeSha -ne $expectedXrayExeSha) {
            throw "xray.exe SHA-256 mismatch: expected $expectedXrayExeSha, got $actualExeSha"
          }
          Copy-Item -LiteralPath $xrayExe -Destination (Join-Path $runtime "xray.exe") -Force
          Copy-Item -LiteralPath $xrayLicense -Destination (Join-Path $runtime "LICENSE-Xray-core") -Force
          [IO.File]::WriteAllText((Join-Path $runtime "xray.sha256"), "$expectedXrayExeSha`n", [Text.Encoding]::ASCII)

          "YOKHAN_SING_BOX_DIR=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Configure optional Windows signing
        id: windows-signing
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.GATES_WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.GATES_WINDOWS_SIGNING_PFX_PASSWORD }}
          EXPECTED_SIGNER: ${{ secrets.GATES_WINDOWS_UPDATE_SIGNER_SHA1 }}
        run: |
          $provided = @($env:PFX_BASE64, $env:PFX_PASSWORD, $env:EXPECTED_SIGNER) |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if ($provided.Count -ne 0 -and $provided.Count -ne 3) {
            throw "Windows signing is optional, but PFX, PFX password, and expected signer must be provided together."
          }
          if ($provided.Count -eq 0) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Output "Windows artifacts will be unsigned; updater downloads will remain manual."
            return
          }
          $thumbprint = $env:EXPECTED_SIGNER -replace '\s', ''
          if ($thumbprint -notmatch '^[0-9A-Fa-f]{40}$') {
            throw "GATES_WINDOWS_UPDATE_SIGNER_SHA1 must be a 40-character certificate thumbprint."
          }
          try {
            $pfxBytes = [Convert]::FromBase64String($env:PFX_BASE64)
          } catch {
            throw "GATES_WINDOWS_SIGNING_PFX_BASE64 is invalid base64."
          }
          if ($pfxBytes.Length -eq 0) { throw "Windows signing PFX is empty." }
          [IO.File]::WriteAllBytes("windows-signing.pfx", $pfxBytes)
          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Test and package
        shell: pwsh
        env:
          GATES_WINDOWS_UPDATE_SIGNER_SHA1: ${{ secrets.GATES_WINDOWS_UPDATE_SIGNER_SHA1 }}
        run: |
          .\gradlew.bat :shared-domain:test :shared-ui:desktopTest :windows-service:test :windows-app:test :windows-app:check :windows-app:packageDistributionForCurrentOS --no-daemon
      - name: Sign and verify
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          GATES_WINDOWS_SIGNING_PFX: ${{ github.workspace }}\windows-signing.pfx
          GATES_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.GATES_WINDOWS_SIGNING_PFX_PASSWORD }}
          GATES_WINDOWS_UPDATE_SIGNER_SHA1: ${{ secrets.GATES_WINDOWS_UPDATE_SIGNER_SHA1 }}
        run: |
          .\windows-app\tools\sign-release.ps1
      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist\windows -Force | Out-Null
          Copy-Item windows-app\build\compose\binaries\main\exe\GATES-*.exe dist\windows\
          Copy-Item windows-app\build\compose\binaries\main\msi\GATES-*.msi dist\windows\
          $artifacts = Get-ChildItem -LiteralPath dist\windows -File |
            Where-Object { $_.Extension -in @('.exe', '.msi') } |
            Sort-Object Name
          if ($artifacts.Count -ne 2) { throw "Expected exactly one final EXE and one final MSI." }
          $checksums = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }
          [IO.File]::WriteAllLines((Join-Path (Resolve-Path dist\windows).Path 'SHA256SUMS.txt'), $checksums, [Text.Encoding]::ASCII)
      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: gates-windows-release
          path: dist/windows/*
          if-no-files-found: error
  publish:
    name: Publish release artifacts
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
      - windows
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v5
        with:
          name: gates-android-release
          path: dist/android
      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: gates-windows-release
          path: dist/windows
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: ${{ needs.prepare.outputs.draft == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/android/**/*.apk
            dist/windows/**/*.exe
            dist/windows/**/*.msi
            dist/windows/SHA256SUMS.txt
  play:
    name: Build Play Bundle
    if: ${{ needs.prepare.outputs.play == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    env:
      YOKHAN_COMPOSE_DASHBOARD: "1"
      CORE_SING_BOX_REPO: ${{ vars.CORE_SING_BOX_REPO }}
      CORE_SING_BOX_GIT_URL: ${{ vars.CORE_SING_BOX_GIT_URL }}
      CORE_LIBNEKO_REPO: ${{ vars.CORE_LIBNEKO_REPO }}
      CORE_LIBNEKO_GIT_URL: ${{ vars.CORE_LIBNEKO_GIT_URL }}
      CORE_GOMOBILE_REPO: ${{ vars.CORE_GOMOBILE_REPO }}
      CORE_GOMOBILE_REF: ${{ vars.CORE_GOMOBILE_REF }}
      CORE_GOMOBILE_GIT_URL: ${{ vars.CORE_GOMOBILE_GIT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: libcore-cache
        uses: actions/cache@v5
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.libcore-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ^1.25
          cache-dependency-path: libcore/go.sum
      - name: Native Build
        if: steps.libcore-cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Verify LibCore artifact
        shell: bash
        run: test -s app/libs/libcore.aar
      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: gradle-play-${{ hashFiles('**/*.gradle.kts') }}
      - name: Restore release keystore
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          fi
      - name: Checkout Library
        run: |
          git submodule update --init 'app/*'
      - name: Gradle Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew :shared-domain:check bundlePlayRelease
      - name: Publish Play bundle
        if: ${{ needs.prepare.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: ${{ needs.prepare.outputs.draft == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            app/build/outputs/bundle/playRelease/app-play-release.aab
