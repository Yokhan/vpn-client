name: Release
on:
  push:
    tags:
      - "v*"
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag"
        required: true
      publish:
        description: "Publish GitHub Release"
        required: false
        default: true
        type: boolean
      play:
        description: "Build Play bundle"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create draft release"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
      play: ${{ steps.meta.outputs.play }}
      draft: ${{ steps.meta.outputs.draft }}
    steps:
      - id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "play=false" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
            echo "play=${{ inputs.play }}" >> "$GITHUB_OUTPUT"
            echo "draft=${{ inputs.draft }}" >> "$GITHUB_OUTPUT"
          fi
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    needs: prepare
    env:
      CORE_SING_BOX_REPO: ${{ vars.CORE_SING_BOX_REPO }}
      CORE_SING_BOX_GIT_URL: ${{ vars.CORE_SING_BOX_GIT_URL }}
      CORE_LIBNEKO_REPO: ${{ vars.CORE_LIBNEKO_REPO }}
      CORE_LIBNEKO_GIT_URL: ${{ vars.CORE_LIBNEKO_GIT_URL }}
      CORE_GOMOBILE_REPO: ${{ vars.CORE_GOMOBILE_REPO }}
      CORE_GOMOBILE_REF: ${{ vars.CORE_GOMOBILE_REF }}
      CORE_GOMOBILE_GIT_URL: ${{ vars.CORE_GOMOBILE_GIT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25
          cache-dependency-path: libcore/go.sum
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - prepare
      - libcore
    env:
      BUILD_PLUGIN: none
      CORE_SING_BOX_REPO: ${{ vars.CORE_SING_BOX_REPO }}
      CORE_SING_BOX_GIT_URL: ${{ vars.CORE_SING_BOX_GIT_URL }}
      CORE_LIBNEKO_REPO: ${{ vars.CORE_LIBNEKO_REPO }}
      CORE_LIBNEKO_GIT_URL: ${{ vars.CORE_LIBNEKO_GIT_URL }}
      CORE_GOMOBILE_REPO: ${{ vars.CORE_GOMOBILE_REPO }}
      CORE_GOMOBILE_REF: ${{ vars.CORE_GOMOBILE_REF }}
      CORE_GOMOBILE_GIT_URL: ${{ vars.CORE_GOMOBILE_GIT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Restore release keystore
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          fi
      - name: Gradle Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew :shared-domain:check app:assembleOssRelease
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist/apk
          find app/build/outputs/apk/oss/release -type f \( -name "*.apk" -o -name "*.dm" -o -name "output-metadata.json" \) -exec cp --parents {} dist/apk \;
      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/apk
  publish:
    name: Publish GitHub Release
    if: ${{ always() && needs.prepare.outputs.publish == 'true' && needs.build.result == 'success' && (needs.prepare.outputs.play != 'true' || needs.play.result == 'success') }}
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
      - play
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: release-assets/apk
      - name: Download Play bundle
        if: ${{ needs.prepare.outputs.play == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: play-aab
          path: release-assets/aab
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: ${{ needs.prepare.outputs.draft == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-assets/**/*.apk
            release-assets/**/*.aab
  play:
    name: Build Play Bundle
    if: ${{ needs.prepare.outputs.play == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - prepare
      - libcore
    env:
      CORE_SING_BOX_REPO: ${{ vars.CORE_SING_BOX_REPO }}
      CORE_SING_BOX_GIT_URL: ${{ vars.CORE_SING_BOX_GIT_URL }}
      CORE_LIBNEKO_REPO: ${{ vars.CORE_LIBNEKO_REPO }}
      CORE_LIBNEKO_GIT_URL: ${{ vars.CORE_LIBNEKO_GIT_URL }}
      CORE_GOMOBILE_REPO: ${{ vars.CORE_GOMOBILE_REPO }}
      CORE_GOMOBILE_REF: ${{ vars.CORE_GOMOBILE_REF }}
      CORE_GOMOBILE_GIT_URL: ${{ vars.CORE_GOMOBILE_GIT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-play-${{ hashFiles('**/*.gradle.kts') }}
      - name: Restore release keystore
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          fi
      - name: Checkout Library
        run: |
          git submodule update --init 'app/*'
      - name: Gradle Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew :shared-domain:check bundlePlayRelease
      - uses: actions/upload-artifact@v4
        with:
          name: play-aab
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
