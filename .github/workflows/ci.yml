name: CI
on:
  push:
    tags-ignore:
      - "*"
  pull_request:
  workflow_dispatch:
    inputs:
      build_task:
        description: "Gradle task to run"
        required: true
        default: "app:assemblePreviewRelease"
        type: choice
        options:
          - "app:assemblePreviewRelease"
          - "app:assembleOssRelease"
      signed:
        description: "Sign artifact with release keystore secrets"
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    env:
      CORE_SING_BOX_REPO: ${{ vars.CORE_SING_BOX_REPO }}
      CORE_SING_BOX_GIT_URL: ${{ vars.CORE_SING_BOX_GIT_URL }}
      CORE_LIBNEKO_REPO: ${{ vars.CORE_LIBNEKO_REPO }}
      CORE_LIBNEKO_GIT_URL: ${{ vars.CORE_LIBNEKO_GIT_URL }}
      CORE_GOMOBILE_REPO: ${{ vars.CORE_GOMOBILE_REPO }}
      CORE_GOMOBILE_REF: ${{ vars.CORE_GOMOBILE_REF }}
      CORE_GOMOBILE_GIT_URL: ${{ vars.CORE_GOMOBILE_GIT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25
          cache-dependency-path: libcore/go.sum
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Verify LibCore artifact
        shell: bash
        run: test -s app/libs/libcore.aar
      - name: Upload LibCore artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar-${{ github.run_id }}
          path: app/libs/libcore.aar
          if-no-files-found: error
          retention-days: 1
  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    env:
      BUILD_PLUGIN: none
      CORE_SING_BOX_REPO: ${{ vars.CORE_SING_BOX_REPO }}
      CORE_SING_BOX_GIT_URL: ${{ vars.CORE_SING_BOX_GIT_URL }}
      CORE_LIBNEKO_REPO: ${{ vars.CORE_LIBNEKO_REPO }}
      CORE_LIBNEKO_GIT_URL: ${{ vars.CORE_LIBNEKO_GIT_URL }}
      CORE_GOMOBILE_REPO: ${{ vars.CORE_GOMOBILE_REPO }}
      CORE_GOMOBILE_REF: ${{ vars.CORE_GOMOBILE_REF }}
      CORE_GOMOBILE_GIT_URL: ${{ vars.CORE_GOMOBILE_GIT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download LibCore artifact
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar-${{ github.run_id }}
          path: app/libs
      - name: Verify LibCore artifact
        shell: bash
        run: test -s app/libs/libcore.aar
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Restore release keystore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed }}
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          fi
      - name: Gradle Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
          GRADLE_TASK: ${{ github.event_name == 'workflow_dispatch' && inputs.build_task || 'app:assemblePreviewRelease' }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew :shared-domain:check :desktop-preview:classes "$GRADLE_TASK"
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist/apk
          find app/build/outputs/apk -type f \( -name "*.apk" -o -name "*.dm" -o -name "output-metadata.json" \) -exec cp --parents {} dist/apk \;
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: dist/apk
